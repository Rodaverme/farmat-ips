name: FARTMAR IPS CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop", "feature/*" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-test:
    name: Backend Tests (PHPUnit / Pest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fartmar_db_test
          POSTGRES_USER: fartmar_user
          POSTGRES_PASSWORD: fartmar_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: fartmar-backend

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, bcmath, ctype, json, xml, zip

      - name: Cache de Composer
        uses: actions/cache@v3
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('fartmar-backend/composer.lock') }}

      - name: Copiar variables de entorno
        run: cp .env.example .env.testing || cp .env .env.testing

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generar App Key
        run: php artisan key:generate --env=testing

      - name: Ejecutar Migraciones y Seeders
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: fartmar_db_test
          DB_USERNAME: fartmar_user
          DB_PASSWORD: fartmar_pass
        run: php artisan migrate:fresh --seed --env=testing

      - name: Correr Pruebas (PHPUnit)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: fartmar_db_test
          DB_USERNAME: fartmar_user
          DB_PASSWORD: fartmar_pass
        run: php artisan test

  frontend-test:
    name: Frontend Tests (Vitest / React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: fartmar-frontend

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: fartmar-frontend/package-lock.json

      - name: Instalar dependencias de Frontend
        run: npm ci || npm install

      - name: Ejecutar Pruebas con Vitest
        run: npm run test

      - name: Construir Proyecto React (Build Check)
        run: npm run build